name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mm2g-android16.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install -g cordova
      - name: Patch printer call
        working-directory: mm2g-android16
        run: |
          python3 - <<'PY'
          p='www/components/common/pdf-services.js'
          s=open(p).read()
          old='cordova.plugins.printer.print(exportHtml.html(), fileName,result);'
          new='try { if (window.cordova && cordova.plugins && cordova.plugins.printer) { cordova.plugins.printer.print(exportHtml.html(), fileName, result); } else { window.alert("PDF export is not available in this build."); } } catch (e) { console.log(e); }'
          assert old in s
          open(p,'w').write(s.replace(old,new))
          PY
      - name: Build
        working-directory: mm2g-android16
        run: |
          cordova platform add android@15.0.0
          cordova plugin add cordova-plugin-file cordova-plugin-device cordova-plugin-zip cordova-plugin-sqlite-2
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: materia-medica-apk
          path: mm2g-android16/platforms/android/app/build/outputs/apk/debug/*.apk
