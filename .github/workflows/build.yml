name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mm2g-android16.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install -g cordova
      - name: Build
        working-directory: mm2g-android16
        run: |
          cordova platform add android@15.0.0
          cordova plugin add cordova-plugin-file cordova-plugin-device cordova-plugin-zip cordova-plugin-printer cordova-plugin-sqlite-2
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: materia-medica-apk
          path: mm2g-android16/platforms/android/app/build/outputs/apk/debug/*.apk
